services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: validata-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "curl -s telnet://localhost:1433 --connect-timeout 2 --max-time 2; test $$? -ne 7"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: src/Validata.Api/Dockerfile
    container_name: validata-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ValidataDb;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - Jwt__Secret=YourSuperSecretKeyForDevelopmentOnly123
      - Jwt__Issuer=Validata
      - Jwt__Audience=ValidataUsers
    ports:
      - "5100:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Validata.Web/Dockerfile
    container_name: validata-web
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver_data:
