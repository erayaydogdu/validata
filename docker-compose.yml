version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: validata-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/Validata.Api
      dockerfile: Dockerfile
    container_name: validata-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ValidataDb;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - Jwt__Secret=YourSuperSecretKeyForDevelopmentOnly123
      - Jwt__Issuer=Validata
      - Jwt__Audience=ValidataUsers
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src/Validata.Web
      dockerfile: Dockerfile
    container_name: validata-web
    environment:
      - API_URL=http://localhost:5000/api/v1
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver_data:
